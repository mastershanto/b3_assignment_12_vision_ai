name: CI/CD Pipeline for Render Deployment

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU PyTorch first to speed up runner setup
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Start FastAPI Server in background
        run: |
          # Start uvicorn server in the background
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          # Wait 5 seconds for server startup
          sleep 5

      - name: Run Verification Tests
        run: |
          python run_tests.py

      - name: Trigger Render Deploy Hook
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment..."
            curl -fX POST "$RENDER_DEPLOY_HOOK"
          else
            echo "Warning: RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping deployment step."
          fi
